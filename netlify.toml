[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_QUOTE_ENDPOINT = "/api/quote"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ——— Security headers (all pages) ———
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://upload.wikimedia.org https://thumb.wikimedia.org https://server.arcgisonline.com https://tile.openstreetmap.org https://s3.amazonaws.com; media-src 'self' blob:; connect-src 'self' https://tiles.openfreemap.org https://nominatim.openstreetmap.org https://upload.wikimedia.org https://thumb.wikimedia.org https://en.wikipedia.org https://commons.wikimedia.org https://api.frankfurter.dev https://api.open-meteo.com https://geocoding-api.open-meteo.com https://router.project-osrm.org https://routing.openstreetmap.de https://firestore.googleapis.com https://server.arcgisonline.com https://tile.openstreetmap.org https://s3.amazonaws.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
